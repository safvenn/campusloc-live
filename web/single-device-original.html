<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusLoc Live</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#183047;font:16px system-ui,sans-serif}main{max-width:780px;margin:7vh auto;padding:24px}header{font-size:13px;letter-spacing:2px;color:#49677b}h1{font-size:42px;margin-bottom:12px}p{line-height:1.6;color:#536b7b}.panel{background:white;padding:28px;border-radius:20px;margin-top:24px;box-shadow:0 10px 40px #1731450c}label{display:block;margin-bottom:10px}input{width:100%;padding:14px;border:1px solid #b4c5d0;border-radius:8px;font:inherit}button{padding:14px 24px;background:#136957;color:white;border:0;border-radius:8px;font:inherit;margin-top:12px;cursor:pointer}#floor{font-size:64px;font-weight:700;margin:22px 0}#levels{display:flex;flex-wrap:wrap;gap:8px}#levels span{padding:10px;border-radius:8px;background:#edf2f6}#levels .active{background:#136957;color:white}.warning{border-left:3px solid #c48c39;padding-left:16px}small{color:#536b7b}
</style></head><body><main><header>CAMPUSLOC / LIVE POSITIONING</header><h1>Your campus. Your floor.</h1><p>Follow the latest Wi-Fi floor estimate from your Android phone.</p>
<section class="panel"><form id="form"><label for="device">Device ID shown in the Android app</label><input id="device" maxlength="64" pattern="[A-Za-z0-9_-]{1,64}" required placeholder="Paste your device ID"><button>Track device</button></form><div aria-live="polite"><div id="floor">—</div><div id="levels"><span>B1</span><span>Ground</span><span>First</span><span>Second</span><span>Third</span><span>Fourth</span></div><p id="status">Waiting for a device.</p><small id="time"></small></div></section>
<p class="warning">Experimental estimates only. Training labels contain conflicts. Do not use this system for navigation.</p></main>
<script>
const input=document.querySelector('#device'), floor=document.querySelector('#floor'), status=document.querySelector('#status'), time=document.querySelector('#time');
let device='',generation=0;
function clear(message){floor.textContent='—';status.textContent=message;time.textContent='';document.querySelectorAll('#levels span').forEach(e=>e.classList.remove('active'));}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();device=input.value.trim();generation++;clear('Loading…');poll(generation);};
async function poll(g){try{const response=await fetch('/api/latest/'+encodeURIComponent(device),{signal:AbortSignal.timeout(5000),cache:'no-store'});if(g!==generation)return;if(!response.ok){clear(response.status===404?'No scans yet. Start tracking on the phone.':'Receiver unavailable.');return;}const data=await response.json();if(g!==generation)return;if(data.stale||!data.broker_connected){clear('Connection or scan is stale. Waiting for fresh data.');return;}floor.textContent=data.predicted_floor||'—';status.textContent=data.error||`${data.recognized_access_points} recognized access points • Experimental estimate`;time.textContent='Last scan: '+new Date(data.captured_at*1000).toLocaleString();document.querySelectorAll('#levels span').forEach(e=>e.classList.toggle('active',e.textContent.toLowerCase()===(data.predicted_floor||'').toLowerCase()));}catch(e){if(g===generation)clear('Receiver unavailable. Reconnecting…');}finally{if(g===generation)setTimeout(()=>poll(g),3000);}}
const initialDevice=new URLSearchParams(location.search).get('device');
if(initialDevice&&/^[A-Za-z0-9_-]{1,64}$/.test(initialDevice)){input.value=initialDevice;document.querySelector('#form').requestSubmit();}
</script></body></html>
